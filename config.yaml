# =============================================================================
# linkedin-agent config
#
# One file drives the whole agent. Everything below is tunable EXCEPT the intent
# of the limits block -- see the warning above it.
#
# After editing `me.profile_url`, run:  python run.py learn
# That reads the live profile and fills in the rest of the `me:` block for you.
# =============================================================================

me:
  # The only value you MUST set by hand. Everything else `learn` discovers.
  profile_url: ""            # e.g. https://www.linkedin.com/in/your-slug/
  name: ""
  first_name: ""
  headline: ""
  about: ""
  location: ""
  services: []               # filled from the profile's Services / About section
  learned_at: ""
  learn_source: auto         # auto | edited -- the dashboard flags 'auto' as unreviewed

# -----------------------------------------------------------------------------
# PROOF -- the only claims the writer is allowed to make.
#
# Hard rule enforced in write.py: the model may reference these and nothing
# else numeric. It may not invent a client, a percentage, or a timeframe. If a
# post needs a number that is not in this list, the post gets written without a
# number. Every line here is GSC-verified.
# -----------------------------------------------------------------------------
# REPLACE EVERY LINE BELOW WITH YOUR OWN VERIFIED NUMBERS.
# The examples are placeholders. Each one should be something you could pull up
# in Search Console, Analytics or an invoice if a prospect asked on a call.
# If you have no numbers yet, delete them all and leave this list empty --
# the writer then writes posts with no figures in them, which is correct.
proof:
  - "<Client or project, category>: <N> clicks and <N> impressions over <N> months."
  - "<Client or project>: from 0 to <N> clicks and <N> impressions in 90 days."
  - "<Client or project>: <N> clicks at a <N>% CTR, roughly <N>x the category average, in 90 days."
  - "<yourdomain.com>: main keyword to page 1 position <N> in <N> months."
  - "Working in <your field> since <year>, around <N> <type of> projects delivered."
  - "Serving clients across <your regions>."

# Things that are true and useful but are positioning, not statistics.
# These are safe to state without a number behind them. Rewrite in your voice.
positioning:
  - "Real ranking movement takes 60 to 90 days. I refuse to promise page one in 30."
  - "A specialist beats a generalist agency in a narrow field, because it is all I do."
  - "Most businesses do not need more traffic. They need the traffic they already get to convert."
  - "Free audit first, then a 30/60/90 roadmap. Prices get quoted after the audit, never before."

# -----------------------------------------------------------------------------
# VOICE -- how everything is written. This is the difference between a post that
# reads like you and a post that reads like ChatGPT.
# -----------------------------------------------------------------------------
voice: >-
  Plain, direct, first person. A practitioner who has actually fixed this for
  real local businesses, not a marketer describing marketing. Short paragraphs,
  one idea each. Concrete specifics over adjectives: name the actual setting in
  Google Business Profile, the actual field, the actual number of days. If the
  honest answer is "you do not need to pay anyone for this", say that. Never
  pitch in a comment. No hype, no em-dashes, no rhetorical questions as openers,
  no "Great question", no "In today's digital landscape", no emoji bullets, no
  engagement bait like "Agree?" or "Thoughts?". British/neutral spelling is fine.
  Write like a text message from someone competent, not a press release.

banned_phrases:
  - "in today's digital landscape"
  - "in today's fast-paced"
  - "game changer"
  - "game-changer"
  - "unlock the power"
  - "unlock your"
  - "supercharge"
  - "let's dive in"
  - "dive deep"
  - "great question"
  - "i hope this helps"
  - "revolutionize"
  - "leverage the power"
  - "at the end of the day"
  - "needle-moving"
  - "synergy"
  - "thoughts?"
  - "agree?"
  - "who else"
  - "drop a comment"
  - "dm me"
  - "link in bio"
  - "as an expert"
  - "delve"
  - "tapestry"
  - "testament to"
  - "it's not just"
  - "🚀"
  - "💡"
  - "🔥"

# -----------------------------------------------------------------------------
# ICP -- who we are trying to reach. Drives both prospecting and comment targets.
# -----------------------------------------------------------------------------
icp:
