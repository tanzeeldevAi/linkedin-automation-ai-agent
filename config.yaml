      enabled: true
      geo: ["United States", "Canada"]
      weight: 1.0
    uk_eu:
      enabled: true
      geo: ["United Kingdom", "Ireland", "Netherlands", "Germany", "Spain"]
      weight: 0.8
    uae:
      enabled: true
      geo: ["United Arab Emirates", "Dubai", "Abu Dhabi", "Saudi Arabia", "Qatar"]
