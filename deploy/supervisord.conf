; Process tree in the container. Order matters: Xvfb must exist before Chrome,
; Chrome must exist before the worker can attach to it. Priorities express that;
; the retry loops in keep_chrome.py and browser.attach() handle the rest, since
; supervisor priorities control start order but not readiness.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info
user=root

[program:xvfb]
command=Xvfb :99 -screen 0 1440x900x24 -nolisten tcp
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; A window manager so the Chrome window is sized, focusable and movable in the
; noVNC view. Without one, logging in by hand is genuinely awkward.
[program:fluxbox]
command=fluxbox
environment=DISPLAY=":99"
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
command=x11vnc -display :99 -forever -shared -rfbport 5900 -rfbauth /data/.vncpass -localhost -quiet
priority=30
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; noVNC in the browser. Listens on all interfaces inside the container only;
; exposure to the internet is Traefik's decision, behind basic auth.
[program:novnc]
command=websockify --web=/usr/share/novnc 0.0.0.0:6080 127.0.0.1:5900
priority=40
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:chrome]
command=python /app/keep_chrome.py
environment=DISPLAY=":99"
priority=50
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:dashboard]
command=python /app/run.py dashboard
priority=60
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:worker]
command=python /app/run.py worker
environment=DISPLAY=":99"
priority=70
autorestart=true
startsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
